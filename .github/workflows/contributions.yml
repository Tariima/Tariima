name: Calendario de contribuciones

on:
  schedule:
    - cron: "17 3 * * *" # todos los días 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/contributions.mjs", ".github/workflows/contributions.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar SVG
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
          GH_LOGIN: Tariima
        run: node scripts/contributions.mjs
      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git diff --cached --quiet && echo "sin cambios" || git commit -m "chore: actualiza calendario de contribuciones" && git push
